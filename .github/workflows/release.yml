name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.2.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Validate release request
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Releases must be started from the main branch."
            exit 1
          fi

          version="${RELEASE_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use semantic version format X.Y.Z, without a leading v."
            exit 1
          fi

          tag="v$version"
          if git ls-remote --exit-code --refs origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag '$tag' already exists. Choose a new version."
            exit 1
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release '$tag' already exists. Choose a new version."
            exit 1
          fi

          current_version="$(bun --eval "console.log((await import('./package.json')).default.version)")"
          if [ "$current_version" != "$version" ]; then
            highest_version="$(printf '%s\n' "$current_version" "$version" | sort -V | tail -n 1)"
            if [ "$highest_version" != "$version" ]; then
              echo "Release version '$version' must be newer than the current version '$current_version'."
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Update application versions
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          VERSION="$VERSION" bun --eval '
            const version = process.env.VERSION;
            if (!version) throw new Error("VERSION is missing");

            const packageJson = await Bun.file("package.json").json();
            packageJson.version = version;
            await Bun.write("package.json", JSON.stringify(packageJson, null, 2) + "\n");

            const configPath = "electrobun.config.ts";
            const config = await Bun.file(configPath).text();
            const configMatches = config.match(/\bversion:\s*"[^"]+"/g) ?? [];
            if (configMatches.length !== 1) {
              throw new Error(`Expected one app version in ${configPath}, found ${configMatches.length}`);
            }
            await Bun.write(
              configPath,
              config.replace(/(\bversion:\s*")[^"]+("\s*,)/, `$1${version}$2`)
            );

            const viewPath = "src/mainview/index.ts";
            const view = await Bun.file(viewPath).text();
            const viewMatches = view.match(/\bconst APP_VERSION = "[^"]+";/g) ?? [];
            if (viewMatches.length !== 1) {
              throw new Error(`Expected one APP_VERSION in ${viewPath}, found ${viewMatches.length}`);
            }
            await Bun.write(
              viewPath,
              view.replace(/(\bconst APP_VERSION = ")[^"]+(";)/, `$1${version}$2`)
            );
          '

      - name: Commit version bump
        id: release
        shell: bash
        env:
          VERSION: ${{ steps.validate.outputs.version }}
          TAG: ${{ steps.validate.outputs.tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json electrobun.config.ts src/mainview/index.ts

          if git diff --cached --quiet; then
            echo "Version files already contain $VERSION. Reusing the current main commit."
          else
            git commit -m "chore: prepare release $TAG"
            git push origin HEAD:main
          fi

          package_version="$(bun --eval "console.log((await import('./package.json')).default.version)")"
          config_version="$(bun --eval "import config from './electrobun.config.ts'; console.log(config.app.version)")"
          app_version="$(sed -n 's/^const APP_VERSION = "\([^"]*\)";/\1/p' src/mainview/index.ts)"

          if [ "$package_version" != "$VERSION" ] || [ "$config_version" != "$VERSION" ] || [ "$app_version" != "$VERSION" ]; then
            echo "Version files do not all contain $VERSION."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }} release
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macOS 14+
          - os: windows-latest
            platform: Windows 11+
          - os: ubuntu-22.04
            platform: Ubuntu 22.04+
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build stable Electrobun release
        run: bunx electrobun build --env=stable

      - name: Validate release artifacts
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d artifacts ]; then
            echo "Electrobun did not create the artifacts directory."
            exit 1
          fi

          if [ -z "$(find artifacts -type f -print -quit)" ]; then
            echo "Electrobun did not produce any release artifacts."
            exit 1
          fi

          find artifacts -type f -print

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oxide-${{ needs.prepare.outputs.tag }}-${{ matrix.os }}
          path: artifacts/**
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs:
      - prepare
      - build
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: oxide-${{ needs.prepare.outputs.tag }}-*
          path: release-assets
          merge-multiple: true

      - name: Create release tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --refs origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag '$TAG' already exists. Refusing to overwrite it."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$COMMIT" -m "Release $TAG"
          git push origin "$TAG"

      - name: Publish release and artifacts
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(find release-assets -type f -print -quit)" ]; then
            echo "No downloaded release artifacts found."
            exit 1
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Oxide $TAG" \
            --generate-notes \
            --verify-tag \
            release-assets/*
