name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}"
          $packageVersion = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $configVersion = (& bun --eval "import config from './electrobun.config.ts'; console.log(config.app.version)" | Out-String).Trim()
          $expectedTag = "v$packageVersion"

          if ($configVersion -ne $packageVersion) {
            throw "package.json version '$packageVersion' does not match electrobun.config.ts version '$configVersion'."
          }

          if ($tagVersion -ne $expectedTag) {
            throw "Release tag '$tagVersion' does not match package.json version '$packageVersion'. Expected '$expectedTag'."
          }

      - name: Build stable Electrobun release
        run: bunx electrobun build --env=stable

      - name: Embed application icon
        run: bun run embed-icon

      - name: Validate release artifacts
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          if (-not (Test-Path -LiteralPath $artifactDir)) {
            throw "Electrobun did not create the artifacts directory."
          }

          $files = @(Get-ChildItem -LiteralPath $artifactDir -Recurse -File)
          if ($files.Count -eq 0) {
            throw "Electrobun did not produce any release artifacts."
          }

          $files | ForEach-Object { Write-Host "Artifact: $($_.FullName)" }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: oxide-${{ github.ref_name }}
          path: artifacts/**
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          $assets = @(Get-ChildItem -LiteralPath $artifactDir -Recurse -File | ForEach-Object { $_.FullName })
          $releaseArgs = @(
            "release",
            "create",
            $env:GITHUB_REF_NAME,
            "--repo",
            $env:GITHUB_REPOSITORY,
            "--title",
            "Oxide $env:GITHUB_REF_NAME",
            "--generate-notes",
            "--verify-tag"
          ) + $assets

          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
