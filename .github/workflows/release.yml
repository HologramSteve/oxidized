name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify release version
    runs-on: ubuntu-22.04

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify tag matches package and app versions
        shell: bash
        run: |
          package_version="$(bun --eval "console.log((await import('./package.json')).default.version)")"
          config_version="$(bun --eval "import config from './electrobun.config.ts'; console.log(config.app.version)")"
          expected_tag="v${package_version}"

          if [ "$package_version" != "$config_version" ]; then
            echo "package.json version '$package_version' does not match electrobun.config.ts version '$config_version'."
            exit 1
          fi

          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Release tag '$GITHUB_REF_NAME' does not match package.json version '$package_version'. Expected '$expected_tag'."
            exit 1
          fi

  build:
    name: Build ${{ matrix.platform }} release
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macOS 14+
          - os: windows-latest
            platform: Windows 11+
          - os: ubuntu-22.04
            platform: Ubuntu 22.04+
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build stable Electrobun release
        run: bunx electrobun build --env=stable

      - name: Embed application icon when supported
        run: bun run embed-icon

      - name: Validate release artifacts
        shell: bash
        run: |
          if [ ! -d artifacts ]; then
            echo "Electrobun did not create the artifacts directory."
            exit 1
          fi

          if [ -z "$(find artifacts -type f -print -quit)" ]; then
            echo "Electrobun did not produce any release artifacts."
            exit 1
          fi

          find artifacts -type f -print

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oxide-${{ github.ref_name }}-${{ matrix.os }}
          path: artifacts/**
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: oxide-${{ github.ref_name }}-*
          path: release-assets
          merge-multiple: true

      - name: Publish release and artifacts
        shell: bash
        run: |
          if [ -z "$(find release-assets -type f -print -quit)" ]; then
            echo "No downloaded release artifacts found."
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Oxide $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            release-assets/*
