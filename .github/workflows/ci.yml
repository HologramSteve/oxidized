name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck and browser bundle
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Bundle browser view
        run: bun build src/mainview/index.ts --target browser --outdir "$RUNNER_TEMP/oxide-web"

  desktop-build:
    name: Desktop build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macOS 14+
          - os: windows-latest
            platform: Windows 11+
          - os: ubuntu-22.04
            platform: Ubuntu 22.04+
    runs-on: ${{ matrix.os }}
    env:
      # no code-signing certificates are configured — don't fail trying to
      # auto-discover identities on macOS/Windows
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop app (electron-builder)
        run: bun run build
